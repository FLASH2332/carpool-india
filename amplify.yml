version: 1
backend:
  phases:
    build:
      commands:
        - nvm install 22
        # npm install, not npm ci: the build's npm reads the lock file differently
        # from older local npm versions, and npm ci fails on that mismatch.
        - npm install --cache .npm --prefer-offline
        - npx ampx pipeline-deploy --branch $AWS_BRANCH --app-id $AWS_APP_ID
frontend:
  phases:
    build:
      commands:
        - nvm install 22
        - npm run build
  artifacts:
    baseDirectory: dist
    files:
      - '**/*'
  cache:
    paths:
      - .npm/**/*
      - node_modules/**/*
